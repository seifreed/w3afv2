[pytest]
markers =
    ci_fails: tests known to fail in continuous integration
    ci_ignore: tests intentionally ignored by continuous integration
    ci_ready: tests suitable for continuous integration
    fails: tests currently known to fail
    functional: functional integration tests
    internet: tests requiring external network access
    moth: tests requiring the Moth test server
    root: tests requiring root privileges
    slow: slow-running tests
    smoke: smoke tests
